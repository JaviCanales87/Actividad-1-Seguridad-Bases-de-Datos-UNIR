
services:
  mongo:
    image: mongo:4.4
    container_name: mongo_db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin_root
      MONGO_INITDB_ROOT_PASSWORD: PasswordSuperSegura123!
      MONGO_INITDB_DATABASE: tienda
    command: ["mongod", "--auth"] # <-- Esto activa la autenticación obligatoria
    volumes:
      - ./scripts/init_mongo.js:/docker-entrypoint-initdb.d/init_mongo.js:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: insecure_elastic
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    networks:
      -  app-net


  fastapi-app:
    build: ./fastapi-app
    container_name: insecure_fastapi
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - elasticsearch
    environment:
      MONGO_HOST: mongo
      MONGO_DATABASE: tienda
      ELASTIC_HOST: elasticsearch
